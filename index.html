<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="titulo">Meus decks</h1>
  </header>

  <main>
       <section id="tela-decks" class="tela">
      <p id="vazio-decks" class="vazio">Você ainda não tem decks.<br>Toque no + para criar o primeiro.</p>
      <div id="lista-decks"></div>
      <button id="btn-novo-deck" class="fab" aria-label="Novo deck">+</button>
    </section>

    <section id="tela-estudo" class="tela">
      <p class="vazio">Aqui ficará a tela de estudo.</p>
    </section>

    <section id="tela-ajustes" class="tela">
      <h2>Tema</h2>
      <div class="grupo-botoes">
        <button class="botao-tema" data-tema="escuro">🌙 Escuro</button>
        <button class="botao-tema" data-tema="claro">☀️ Claro</button>
      </div>
    </section>
  </main>

  <nav>
    <button data-tela="decks">📚<span>Decks</span></button>
    <button data-tela="estudo">🧠<span>Estudar</span></button>
    <button data-tela="ajustes">⚙️<span>Ajustes</span></button>
  </nav>
  <div id="modal" class="modal oculto">
    <div class="modal-caixa">
      <h2 id="modal-titulo">Novo deck</h2>
      <input id="input-nome" type="text" placeholder="Nome do deck" maxlength="60" autocomplete="off">
      <button id="btn-salvar" class="btn principal">Salvar</button>
      <button id="btn-apagar" class="btn perigo oculto">Apagar deck</button>
      <button id="btn-cancelar" class="btn">Cancelar</button>
    </div>
  </div>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
